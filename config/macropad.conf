# Deep sleep after 15 min idle; any key wakes it and reconnects to the last BLE profile.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Power-off key (&soft_off in the keymap).
CONFIG_ZMK_PM_SOFT_OFF=y

# Battery level shown in macOS Bluetooth settings (implied by BLE, set explicitly).
CONFIG_ZMK_BATTERY_REPORTING=y
